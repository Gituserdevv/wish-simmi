<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Special ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #dfac38;
            --gold-light: #ffd700;
            --deep-red: #3a0d18;
            --glass-bg: rgba(20, 10, 15, 0.75);
            --glass-border: rgba(223, 172, 56, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at center, #2b0b14 0%, #0a0407 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            perspective: 1500px;
            color: #fff;
        }

        /* Dynamic Particle Canvas Background */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* 3D Glassmorphism Book Container */
        .book {
            width: 360px;
            height: 540px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(223, 172, 56, 0.15);
            border-radius: 12px;
            z-index: 10;
        }

        /* Page Layout */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            backface-visibility: hidden;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 1.2s;
            box-shadow: inset 0 0 20px rgba(223, 172, 56, 0.05);
        }

        /* Page Lighting/Shadow Effect on Flip */
        .page::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.4) 0%, transparent 20%);
            pointer-events: none;
            border-radius: 12px;
        }

        /* Typography */
        h1.gold-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(223, 172, 56, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .typewriter-container {
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typewriter-text {
            font-size: 0.95rem;
            color: #eaeaea;
            line-height: 1.8;
            font-weight: 300;
            white-space: pre-wrap;
            word-spacing: 3px;    
        }

        /* Glowing Glass Button */
        .glow-btn {
            background: linear-gradient(135deg, rgba(223, 172, 56, 0.2), rgba(223, 172, 56, 0.05));
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(223, 172, 56, 0.2);
            outline: none;
        }

        .glow-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 30px rgba(223, 172, 56, 0.6);
            transform: translateY(-2px);
        }

        /* Polaroid Frame Scratch Area */
        .polaroid-frame {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 10px 25px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .polaroid-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .photo-container {
            width: 220px; height: 260px; /* Size updated to make images bigger */
            position: relative;
            border-radius: 6px;
            overflow: hidden;
        }

        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .scratch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }

        /* Realistic Cake & Candle Blow */
        .cake-area { position: relative; width: 120px; height: 120px; margin: 15px 0; }
        
        .cake-base {
            position: absolute; bottom: 0; width: 100%; height: 50px;
            background: linear-gradient(to right, #2b0b14, #5c1827, #2b0b14);
            border-radius: 8px 8px 0 0;
            border-top: 3px solid var(--gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .candle {
            position: absolute; bottom: 50px; left: 50%;
            width: 8px; height: 35px;
            background: linear-gradient(to right, #fff, #e0e0e0);
            border-radius: 3px;
            transform: translateX(-50%);
        }

        .flame {
            position: absolute; bottom: 85px; left: 50%;
            width: 16px; height: 26px;
            background: radial-gradient(ellipse at bottom, #ffea00 0%, #ff5e00 60%, transparent 100%);
            border-radius: 50% 50% 35% 35%;
            transform: translateX(-50%);
            animation: flameGlow 0.15s infinite alternate;
            filter: drop-shadow(0 0 10px #ff9900);
        }

        @keyframes flameGlow {
            0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
            100% { transform: translateX(-50%) scale(1.08) rotate(1deg); }
        }

        #micStatus {
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 1px;
            opacity: 0.8;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <!-- Ambient Particles Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <div class="book" id="myBook">

        <!-- PAGE 1: Cover -->
        <div class="page" id="page1" style="z-index: 6; transform: rotateY(0deg);">
            <div>
                <div class="subtitle">A Special Gesture</div>
                <h1 class="gold-title">Happy Birthday</h1>
            </div>
            <div class="typewriter-container">
                <p class="typewriter-text" data-text="A small space created to celebrate you, your journey, and the wonderful moments ahead..."></p>
            </div>
            <button class="glow-btn" onclick="openBook()">BEGIN EXPERIENCE ✨</button>
        </div>

        <!-- PAGE 2: Memory 1 -->
        <div class="page" id="page2" style="z-index: 5;">
            <div class="subtitle">Chapter I • Memories</div>
            <div class="typewriter-container">
                <p class="typewriter-text" data-text="Some memories always carry a soft, timeless warmth. Scratch below to unveil..."></p>
            </div>
            <div class="polaroid-frame">
                <div class="photo-container">
                    <img src="images/photo1.jpg" alt="Memory 1">
                    <canvas id="scratch1" class="scratch-canvas"></canvas>
                </div>
            </div>
            <button class="glow-btn" onclick="nextPage(2)">CONTINUE ➔</button>
        </div>

        <!-- PAGE 3: Memory 2 -->
        <div class="page" id="page3" style="z-index: 4;">
            <div class="subtitle">Chapter II • Wishes</div>
            <div class="typewriter-container">
                <p class="typewriter-text" data-text="Wishing you a path ahead full of grace, success, and pure happiness..."></p>
            </div>
            <div class="polaroid-frame" style="transform: rotate(2deg);">
                <div class="photo-container">
                    <img src="images/photo2.jpg" alt="Memory 2">
                    <canvas id="scratch2" class="scratch-canvas"></canvas>
                </div>
            </div>
            <button class="glow-btn" onclick="nextPage(3)">CONTINUE ➔</button>
        </div>

        <!-- PAGE 4: Memory 3 (Added) -->
        <div class="page" id="page4" style="z-index: 3;">
            <div class="subtitle">Chapter III • Moments</div>
            <div class="typewriter-container">
                <p class="typewriter-text" data-text="A few more frames of beautiful memories we cherish together..."></p>
            </div>
            <div class="polaroid-frame" style="transform: rotate(-1.5deg);">
                <div class="photo-container">
                    <img src="images/photo3.jpg" alt="Memory 3">
                    <canvas id="scratch3" class="scratch-canvas"></canvas>
                </div>
            </div>
            <button class="glow-btn" onclick="nextPage(4)">CONTINUE ➔</button>
        </div>

        <!-- PAGE 5: Memory 4 (Added) -->
        <div class="page" id="page5" style="z-index: 2;">
            <div class="subtitle">Chapter IV • Forever</div>
            <div class="typewriter-container">
                <p class="typewriter-text" data-text="Every single moment with you is special, unique and unforgettable..."></p>
            </div>
            <div class="polaroid-frame" style="transform: rotate(1.5deg);">
                <div class="photo-container">
                    <img src="images/photo4.jpg" alt="Memory 4">
                    <canvas id="scratch4" class="scratch-canvas"></canvas>
                </div>
            </div>
            <button class="glow-btn" onclick="nextPage(5)">MAKE A WISH ➔</button>
        </div>

        <!-- PAGE 6: Celebration & Candle -->
        <div class="page" id="page6" style="z-index: 1;">
            <div class="subtitle">Final Chapter • Celebration</div>
            <h1 class="gold-title">Make A Wish</h1>
            <div class="cake-area">
                <div class="flame" id="mainFlame"></div>
                <div class="candle"></div>
                <div class="cake-base"></div>
            </div>
            <p id="micStatus">Blow into your mic to blow out the candle ✨</p>
            <div style="height: 10px;"></div>
        </div>

    </div>

    <!-- AUDIO FILES -->
    <audio id="bdayAudio" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=happy-birthday-15220.mp3"></audio>

    <script>
        
        // --- EXPIRY & MASTER LOCK LOGIC ---
        (function checkExpiryAndLock() {
            const expiryDate = new Date("2026-08-11T23:59:59");
            const currentDate = new Date();
            const MASTER_PASSCODE = "1234";

            if (currentDate > expiryDate) {
                const lockScreen = document.createElement('div');
                lockScreen.id = 'lockScreenOverlay';
                lockScreen.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                    background: #0a0407; color: #dfac38; display: flex;
                    flex-direction: column; align-items: center; justify-content: center;
                    z-index: 99999; font-family: 'Montserrat', sans-serif; text-align: center;
                    padding: 20px;
                `;

                lockScreen.innerHTML = `
                    <h2 style="font-size: 1.8rem; margin-bottom: 10px;">✨ Memory Archived</h2>
                    <p style="color: #aaa; font-size: 0.9rem; max-width: 300px;">This special birthday link was available until August 8, 2026 and is now closed.</p>
                    <button id="adminUnlockBtn" style="margin-top: 40px; background: transparent; border: 1px solid rgba(223, 172, 56, 0.2); color: rgba(223, 172, 56, 0.4); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;">Owner Access</button>
                `;

                document.body.appendChild(lockScreen);

                document.getElementById('adminUnlockBtn').addEventListener('click', function() {
                    const userPass = prompt("Enter Master Passcode to view:");
                    if (userPass === MASTER_PASSCODE) {
                        alert("Access Granted ✨ Welcome Boss!");
                        lockScreen.remove();
                    } else if (userPass !== null) {
                        alert("Incorrect Passcode!");
                    }
                });
            }
        })();

        // --- 1. Ambient Background Particles ---
        const bgCanvas = document.getElementById('bgCanvas');
        const ctx = bgCanvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 0.5 + 0.2);
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(223, 172, 56, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 2. Storybook Mechanics & Typewriter ---
        function openBook() {
            startTypewriter('page1');
            nextPage(1);
            document.getElementById('bdayAudio').play().catch(() => {});
        }

        function nextPage(pageNum) {
            const page = document.getElementById(`page${pageNum}`);
            page.style.transform = "rotateY(-160deg)";
            
            if (pageNum + 1 === 2) initScratch('scratch1');
            if (pageNum + 1 === 3) initScratch('scratch2');
            if (pageNum + 1 === 4) initScratch('scratch3');
            if (pageNum + 1 === 5) initScratch('scratch4');
            if (pageNum + 1 === 6) initCandle();

            setTimeout(() => {
                startTypewriter(`page${pageNum + 1}`);
            }, 400);
        }

        function startTypewriter(pageId) {
            const container = document.getElementById(pageId);
            if (!container) return;
            const textEl = container.querySelector('.typewriter-text');
            const fullText = textEl.getAttribute('data-text');

            textEl.textContent = '';
            let i = 0;

            function type() {
                if (i < fullText.length) {
                    textEl.textContent += fullText.charAt(i);
                    i++;
                    setTimeout(type, 40);
                }
            }
            type();
        }

        // --- 3. Shimmer Scratch Card ---
        function initScratch(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || canvas.dataset.initialized) return;
            canvas.dataset.initialized = "true";

            const sCtx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            let grad = sCtx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#dfac38');
            grad.addColorStop(0.5, '#fff2a8');
            grad.addColorStop(1, '#9e751d');
            sCtx.fillStyle = grad;
            sCtx.fillRect(0, 0, canvas.width, canvas.height);

            sCtx.fillStyle = '#2b0b14';
            sCtx.font = '600 12px Montserrat';
            sCtx.textAlign = 'center';
            sCtx.fillText('SCRATCH TO REVEAL', canvas.width / 2, canvas.height / 2 + 4);

            let isScratching = false;

            function scratch(e) {
                if (!isScratching) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                sCtx.globalCompositeOperation = 'destination-out';
                sCtx.beginPath();
                sCtx.arc(x, y, 20, 0, Math.PI * 2);
                sCtx.fill();
            }

            canvas.addEventListener('mousedown', () => isScratching = true);
            canvas.addEventListener('mouseup', () => isScratching = false);
            canvas.addEventListener('mousemove', scratch);
            
            canvas.addEventListener('touchstart', () => isScratching = true);
            canvas.addEventListener('touchend', () => isScratching = false);
            canvas.addEventListener('touchmove', scratch);
        }

        // --- 4. Interactive Candle Blow ---
        function initCandle() {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const audioCtx = new AudioContext();
                const mic = audioCtx.createMediaStreamSource(stream);
                const analyzer = audioCtx.createAnalyser();
                analyzer.fftSize = 256;
                mic.connect(analyzer);

                const data = new Uint8Array(analyzer.frequencyBinCount);

                function detectBlow() {
                    analyzer.getByteFrequencyData(data);
                    let sum = data.reduce((a, b) => a + b, 0);
                    let avg = sum / data.length;

                    if (avg > 50) {
                        extinguishCandle();
                        stream.getTracks().forEach(t => t.stop());
                        return;
                    }
                    requestAnimationFrame(detectBlow);
                }
                detectBlow();
            }).catch(() => {
                document.getElementById('micStatus').innerText = "Tap the flame to blow out! ✨";
                document.getElementById('mainFlame').addEventListener('click', extinguishCandle);
            });
        }

        function extinguishCandle() {
            document.getElementById('mainFlame').style.display = 'none';
            document.getElementById('micStatus').innerText = "Wish Sent to the Stars ✨";
            
            confetti({ particleCount: 120, spread: 100, origin: { y: 0.6 }, colors: ['#dfac38', '#ffffff', '#ff5e00'] });
            setTimeout(() => {
                confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } });
            }, 300);
        }

        startTypewriter('page1');

    </script>
</body>
</html>
